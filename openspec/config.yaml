schema: spec-driven

context: |
  This repo is the Modern Java book (mdBook), not an application. All content is Markdown under src/.
  There are no unit tests. A scenario is verified by a build or structure check: mdbook build,
  dev/check-summary.mjs (new pages listed in src/SUMMARY.md), or markdownlint on changed pages.
  Topic ordering is the core rule: a page may only use concepts taught in earlier pages.
  Java snippets target the newest Java (instance void main(), IO.println).
  Never change the master branch or .github/workflows/deploy-gh-pages.yaml.

rules:
  specs:
    - Every scenario names the check that proves it (gate name or script path)
  tasks:
    - Each task maps to one scenario or one gate fix

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
