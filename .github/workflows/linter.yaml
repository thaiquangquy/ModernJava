name: Linter

on: [pull_request]

permissions:
  contents: read

jobs:
  markdown-linter:
    name: "Markdown Linter"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint changed book pages
        env:
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Only changed pages: the existing book has many pre-existing lint errors.
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- 'src/*.md' 'src/**/*.md')
          if [ ${#files[@]} -eq 0 ]; then echo "No changed pages under src/."; exit 0; fi
          npx markdownlint --config .markdownlint.yaml "${files[@]}"

